<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="agx-token" content="__AGX_TOKEN__">
<title>AGX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2309090a'/><rect x='2' y='2' width='28' height='28' fill='none' stroke='%23ededf0' stroke-width='1.5'/><text x='16' y='21' font-family='monospace' font-size='12' font-weight='bold' text-anchor='middle' fill='%23ededf0'>AGX</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">AGX</h1>
    <p class="sub" id="sub">loading…</p>
  </header>

  <div id="view-ops">
    <nav class="row controls" aria-label="Team controls">
      <button class="b-go" data-act="cycle">AUTO CYCLE &mdash; DECIDE + WORK</button>
      <button data-act="team">RUN TEAM</button>
      <a class="btn" href="/office" target="_blank" rel="noopener">PIXEL OFFICE</a>
      <button data-do="toggleScan" aria-expanded="false" aria-controls="scanbox">+ ADD PROJECT</button>
      <button class="b-danger" data-act="stop_all">STOP EVERYTHING</button>
    </nav>
    <div class="frame" id="scanbox" hidden></div>
    <div class="row addpath">
      <input type="text" id="newpath" placeholder="or type a project path…" aria-label="Project path to add">
      <button data-do="addManual">ADD PATH</button>
    </div>

    <section class="frame setbar" aria-label="Settings">
      <div>
        <h2 class="label">Model per agent</h2>
        <div id="models"></div>
      </div>
      <div class="notewrap">
        <label class="label" for="note">What you are working on (kept between sessions)</label>
        <textarea id="note" placeholder="e.g. fixing the RGB fusion for SignFlow, then the Mac class_map bug"></textarea>
      </div>
    </section>

    <section class="hud" id="hud" aria-label="Totals"></section>

    <section class="frame feedbox" aria-labelledby="feedh">
      <h2 class="label" id="feedh">Live activity</h2>
      <div id="feed" aria-live="polite"></div>
    </section>

    <main id="grid"></main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt" hidden>
  <div id="ovb" class="frame">
    <div id="ovh"><h2 id="ovt"></h2><button id="ovx" data-do="closeOv">CLOSE</button></div>
    <div id="ovc"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
